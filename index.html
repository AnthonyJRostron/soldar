<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Soldadura - Anthony Rostron</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e2e8f0;line-height:1.5;font-size:16px;min-height:100dvh;display:flex;justify-content:center;overflow-x:hidden}
:root{--panel:#1e293b;--panel-2:#0f172a;--border:#334155;--text:#e2e8f0;--text-dim:#94a3b8;--accent:#f97316;--accent-2:#ea580c;--ok:#22c55e;--warn:#eab308;--danger:#ef4444;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--bottom-nav-h:64px;--radius:12px;--radius-sm:8px}
.app{width:100%;max-width:560px;background:var(--panel);display:flex;flex-direction:column;min-height:100dvh;overflow:hidden}
header{position:sticky;top:0;z-index:100;padding:calc(var(--safe-top) + 12px) 16px 12px;background:linear-gradient(135deg,#ea580c,#c2410c);display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 12px rgba(0,0,0,0.3)}
header h1{font-size:0.95rem;font-weight:700;color:white;line-height:1.2}
.header-controls{display:flex;gap:6px}
.unit-toggle,.lang-toggle{display:flex;background:rgba(0,0,0,0.25);border-radius:8px;padding:3px;font-size:0.72rem;font-weight:700}
.unit-toggle button,.lang-toggle button{background:transparent;border:none;color:white;padding:6px 9px;border-radius:6px;cursor:pointer;opacity:0.65;font-family:inherit;font-weight:700;min-width:32px;min-height:28px}
.unit-toggle button.active,.lang-toggle button.active{background:white;color:var(--accent-2);opacity:1}
.content{flex:1;overflow-y:auto;padding-bottom:calc(var(--bottom-nav-h) + var(--safe-bottom) + 20px)}
.panel{padding:18px 16px;display:none}
.panel.active{display:block;animation:fadeIn 0.2s}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;height:calc(var(--bottom-nav-h) + var(--safe-bottom));padding-bottom:var(--safe-bottom);background:rgba(15,23,42,0.95);backdrop-filter:blur(16px);border-top:1px solid var(--border);display:flex;z-index:200}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:transparent;border:none;color:var(--text-dim);font-size:0.6rem;font-weight:600;cursor:pointer;min-height:48px;position:relative}
.nav-btn .icon{font-size:1.35rem}
.nav-btn.active{color:var(--accent)}
.nav-btn.active::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:28px;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
label{display:block;font-size:0.72rem;color:var(--text-dim);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px}
select,input[type="number"],input[type="text"]{width:100%;padding:13px 14px;background:var(--panel-2);border:1.5px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:16px;font-family:inherit;margin-bottom:14px;outline:none;-webkit-appearance:none;min-height:48px}
select{background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'%3e%3cpath fill='%2394a3b8' d='M6 8L0 0h12z'/%3e%3c/svg%3e");background-repeat:no-repeat;background-position:right 14px center;padding-right:40px}
select:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(249,115,22,0.15)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:360px){.row{grid-template-columns:1fr}}
.btn-primary{width:100%;padding:15px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:white;border:none;border-radius:var(--radius-sm);font-size:1rem;font-weight:700;min-height:52px;margin-top:8px;cursor:pointer}
.btn-primary:active{transform:scale(0.97)}
.btn-secondary{background:transparent;border:1.5px solid var(--border);color:var(--text-dim);padding:11px 14px;border-radius:var(--radius-sm);font-size:0.82rem;font-weight:600;min-height:44px;cursor:pointer}
.btn-secondary:active{background:rgba(249,115,22,0.1);border-color:var(--accent);color:var(--accent)}
.result{margin-top:18px;padding:18px;background:var(--panel-2);border-radius:var(--radius);border-left:4px solid var(--accent);display:none}
.result.show{display:block;animation:slideUp 0.3s}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.current-range{font-size:clamp(2rem,9vw,2.6rem);font-weight:800;color:var(--accent);text-align:center;line-height:1.05}
.current-label{text-align:center;color:var(--text-dim);font-size:0.68rem;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:16px;font-weight:600}
.detail-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #1e293b;font-size:0.88rem;gap:12px}
.detail-row:last-child{border-bottom:none}
.detail-label{color:var(--text-dim)}
.detail-value{color:var(--text);font-weight:600;text-align:right}
.polarity-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:0.7rem;font-weight:700}
.dc-{background:#1e40af;color:#dbeafe}.dc\+{background:#991b1b;color:#fee2e2}.ac{background:#166534;color:#dcfce7}
.warning{margin-top:14px;padding:12px 13px;background:rgba(234,179,8,0.1);border-left:3px solid var(--warn);border-radius:6px;font-size:0.8rem;color:#fde047;line-height:1.5}
.warning.danger{background:rgba(239,68,68,0.1);border-left-color:var(--danger);color:#fca5a5}
.warning.ok{background:rgba(34,197,94,0.1);border-left-color:var(--ok);color:#86efac}
.heat-input{margin-top:14px;padding:14px;background:rgba(249,115,22,0.08);border-radius:var(--radius-sm);border:1px dashed rgba(249,115,22,0.4)}
.heat-input h3{font-size:0.72rem;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;font-weight:700}
.table-wrap{overflow-x:auto;border-radius:var(--radius-sm);margin-bottom:18px;border:1px solid var(--border)}
.ref-table{width:100%;border-collapse:collapse;font-size:0.78rem;min-width:320px}
.ref-table th{text-align:left;padding:10px 12px;color:var(--accent);font-weight:700;background:var(--panel-2);text-transform:uppercase;font-size:0.66rem;letter-spacing:0.5px;position:sticky;top:0}
.ref-table td{padding:10px 12px;border-top:1px solid #1e293b;color:var(--text);white-space:nowrap}
.ref-table td:last-child{text-align:right;color:var(--text-dim)}
.ref-section-title{font-size:0.85rem;color:var(--text);font-weight:700;margin:18px 0 10px}
.duty-bar{height:10px;background:#1e293b;border-radius:5px;overflow:hidden;margin-top:8px}
.duty-bar-fill{height:100%;background:var(--ok);transition:width 0.4s,background 0.3s;border-radius:5px}
.process-tabs{display:flex;gap:6px;margin-bottom:18px;overflow-x:auto;padding-bottom:4px}
.process-tab{flex:0 0 auto;padding:10px 16px;border-radius:10px;background:var(--panel-2);border:1.5px solid var(--border);color:var(--text-dim);font-size:0.8rem;font-weight:700;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.process-tab.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:var(--accent);color:white}
.toast{position:fixed;left:50%;bottom:calc(var(--bottom-nav-h) + var(--safe-bottom) + 16px);transform:translateX(-50%) translateY(20px);background:rgba(15,23,42,0.98);color:white;padding:12px 20px;border-radius:24px;font-size:0.85rem;font-weight:600;z-index:1000;opacity:0;pointer-events:none;transition:opacity 0.25s,transform 0.25s;max-width:calc(100% - 40px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.machine-info{padding:12px 14px;background:rgba(34,197,94,0.08);border-left:3px solid var(--ok);border-radius:6px;font-size:0.8rem;color:#86efac;margin-bottom:14px;display:none}
.machine-info.show{display:block}
.constraint-note{padding:10px 12px;background:rgba(249,115,22,0.08);border-left:3px solid var(--accent);border-radius:6px;font-size:0.75rem;color:#fdba74;margin-bottom:14px;display:none;line-height:1.6}
.constraint-note.show{display:block}
.constraint-note strong{color:var(--accent);display:block;margin-bottom:4px;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.5px}
.machine-search-wrapper{position:relative;margin-bottom:14px}
.machine-search-wrapper input{margin-bottom:0;padding-right:44px}
.machine-search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:var(--text-dim);font-size:1.1rem;cursor:pointer;padding:8px;min-width:36px;min-height:36px;display:none}
.machine-search-clear.show{display:block}
.search-hint{font-size:0.7rem;color:var(--text-dim);margin-top:-8px;margin-bottom:14px;padding-left:4px}
.custom-machines-list{margin-top:14px}
.custom-machine-item{padding:10px 12px;background:var(--panel-2);border-radius:var(--radius-sm);border:1px solid var(--border);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:0.85rem}
.custom-machine-item button{background:transparent;border:none;color:var(--danger);font-size:1.1rem;cursor:pointer;padding:6px;min-width:40px;min-height:40px}
.add-machine-form{display:none;margin-top:14px;padding:14px;background:var(--panel-2);border-radius:var(--radius-sm);border:1px solid var(--border)}
.add-machine-form.show{display:block}
.guide-card{padding:16px;background:var(--panel-2);border:2px solid transparent;border-radius:var(--radius);margin-bottom:14px;transition:all 0.35s cubic-bezier(0.16,1,0.3,1)}
.guide-card h3{font-size:0.95rem;color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:8px;font-weight:700;flex-wrap:wrap}
.guide-card p{font-size:0.82rem;line-height:1.6;color:var(--text);margin-bottom:6px}
.guide-card p:last-child{margin-bottom:0}
.guide-card .active-badge{display:none;font-size:0.6rem;padding:3px 9px;background:var(--accent);color:white;border-radius:10px;text-transform:uppercase;letter-spacing:0.6px;font-weight:800}
.guide-card.highlighted{border-color:var(--accent);background:linear-gradient(135deg,rgba(249,115,22,0.10),rgba(234,88,12,0.05));box-shadow:0 0 0 4px rgba(249,115,22,0.15),0 8px 24px rgba(249,115,22,0.15);transform:translateY(-1px)}
.guide-card.highlighted .active-badge{display:inline-block;animation:pulseBadge 2s infinite}
.guide-card.highlighted h3{color:#fbbf24}
@keyframes pulseBadge{0%,100%{opacity:1}50%{opacity:0.7}}
@media(min-width:768px){body{align-items:flex-start;padding:20px}.app{border-radius:20px;max-height:calc(100vh - 40px)}.bottom-nav{position:sticky;transform:none;left:auto}}
</style>
</head>
<body>
<div class="app">
<header>
<h1>⚡ Soldadura<br><span style="font-size:0.75rem;opacity:0.9">Anthony Rostron</span></h1>
<div class="header-controls">
<div class="lang-toggle" id="langToggle"><button data-lang="es" class="active">ES</button><button data-lang="en">EN</button></div>
<div class="unit-toggle" id="unitToggle"><button data-unit="metric" class="active">mm</button><button data-unit="imperial">in</button></div>
</div>
</header>
<div class="content" id="content">

<div class="panel active" id="tab-calc">
<div id="machineBanner" class="machine-info"></div>
<div id="constraintNote" class="constraint-note"></div>

<label>Proceso de Soldadura</label>
<div class="process-tabs" id="processTabs">
<button class="process-tab active" data-process="mig">🔵 MIG/MAG</button>
<button class="process-tab" data-process="tig">🟢 TIG</button>
<button class="process-tab" data-process="stick">🟠 Electrodo</button>
<button class="process-tab" data-process="fcaw">🟣 FCAW</button>
</div>

<div id="migInputs" class="process-inputs">
<div class="row"><div><label for="migWire">Ø Hilo</label><select id="migWire"></select></div>
<div><label for="migThickness">Espesor (<span class="unit-label">mm</span>)</label><input type="number" id="migThickness" value="6" min="0.5" max="50" step="0.5" inputmode="decimal"></div></div>
<div class="row"><div><label for="migJoint">Junta</label><select id="migJoint"><option value="butt">A tope</option><option value="lap">Solape</option><option value="tee" selected>En T</option><option value="corner">Esquina</option></select></div>
<div><label for="migPosition">Posición</label><select id="migPosition"><option value="flat" selected>Plana</option><option value="horizontal">Horizontal</option><option value="vertical">Vertical</option><option value="overhead">Sobre cabeza</option></select></div></div>
<div id="migGasGroup"><label for="migGas">Gas</label><select id="migGas"><option value="mix" selected>Ar + CO₂ (M21)</option><option value="co2">CO₂ (100%)</option><option value="ar">Argón puro</option></select></div>
</div>

<div id="tigInputs" class="process-inputs" style="display:none">
<div class="row"><div><label for="tigMaterial">Material</label><select id="tigMaterial"><option value="carbon" selected>Acero al Carbono</option><option value="stainless">Acero Inoxidable</option><option value="aluminum">Aluminio</option></select></div>
<div><label for="tigThickness">Espesor (<span class="unit-label">mm</span>)</label><input type="number" id="tigThickness" value="3" min="0.4" max="20" step="0.1" inputmode="decimal"></div></div>
<div class="row"><div><label for="tigJoint">Junta</label><select id="tigJoint"><option value="butt" selected>A tope</option><option value="lap">Solape</option><option value="tee">En T</option><option value="corner">Esquina</option></select></div>
<div><label for="tigPosition">Posición</label><select id="tigPosition"><option value="flat" selected>Plana</option><option value="horizontal">Horizontal</option><option value="vertical">Vertical</option><option value="overhead">Sobre cabeza</option></select></div></div>
</div>

<div id="stickInputs" class="process-inputs" style="display:none">
<label for="stickElectrode">Electrodo</label><select id="stickElectrode"></select>
<div class="row"><div><label for="stickDiameter">Ø Electrodo</label><select id="stickDiameter"></select></div>
<div><label for="stickThickness">Espesor (<span class="unit-label">mm</span>)</label><input type="number" id="stickThickness" value="6" min="0.5" max="50" step="0.5" inputmode="decimal"></div></div>
<div class="row"><div><label for="stickJoint">Junta</label><select id="stickJoint"><option value="butt">A tope</option><option value="lap">Solape</option><option value="tee" selected>En T</option><option value="corner">Esquina</option></select></div>
<div><label for="stickPosition">Posición</label><select id="stickPosition"><option value="flat" selected>Plana</option><option value="horizontal">Horizontal</option><option value="vertical">Vertical</option><option value="overhead">Sobre cabeza</option></select></div></div>
<label for="stickMaterial">Material</label><select id="stickMaterial"><option value="carbon" selected>Acero al Carbono</option><option value="stainless">Acero Inoxidable</option><option value="cast">Hierro Fundido</option></select>
</div>

<div id="fcawInputs" class="process-inputs" style="display:none">
<div class="row"><div><label for="fcawWire">Ø Hilo</label><select id="fcawWire"></select></div>
<div><label for="fcawThickness">Espesor (<span class="unit-label">mm</span>)</label><input type="number" id="fcawThickness" value="6" min="1" max="30" step="0.5" inputmode="decimal"></div></div>
<div class="row"><div><label for="fcawJoint">Junta</label><select id="fcawJoint"><option value="butt">A tope</option><option value="lap">Solape</option><option value="tee" selected>En T</option><option value="corner">Esquina</option></select></div>
<div><label for="fcawPosition">Posición</label><select id="fcawPosition"><option value="flat" selected>Plana</option><option value="horizontal">Horizontal</option><option value="vertical">Vertical</option><option value="overhead">Sobre cabeza</option></select></div></div>
<div id="fcawGasGroup"><label for="fcawGas">Gas</label><select id="fcawGas"><option value="co2" selected>CO₂ (100%)</option><option value="mix">Ar + CO₂ (M21)</option></select></div>
<div id="fcawGaslessNote" style="display:none;padding:10px 12px;background:rgba(34,197,94,0.1);border-left:3px solid var(--ok);border-radius:6px;font-size:0.75rem;color:#86efac;margin-bottom:14px">✓ Sin gas — este modelo usa hilo tubular con fundente interno (self-shielded).</div>
</div>

<button class="btn-primary" id="btnCalc">Calcular Parámetros</button>

<div class="result" id="result">
<div class="current-range" id="currentRange">—</div>
<div class="current-label" id="resultProcessLabel">Amperaje Recomendado</div>
<div class="detail-row"><span class="detail-label">Voltaje</span><span class="detail-value" id="voltageOut">—</span></div>
<div class="detail-row"><span class="detail-label">Polaridad</span><span class="detail-value" id="polarityOut">—</span></div>
<div class="detail-row"><span class="detail-label">Gas</span><span class="detail-value" id="gasFlowOut">—</span></div>
<div class="detail-row"><span class="detail-label" id="wireSpeedLabel">Vel. Hilo (m/min)</span><span class="detail-value" id="wireSpeedOut">—</span></div>
<div class="detail-row"><span class="detail-label">Pasadas</span><span class="detail-value" id="passesOut">—</span></div>
<div class="heat-input"><h3>🔥 Aporte Térmico</h3>
<div class="row"><div><label>Vel. (mm/min)</label><input type="number" id="travelSpeed" value="200" min="20" max="800" step="10" inputmode="numeric"></div>
<div><label>Corriente (A)</label><input type="number" id="heatAmps" value="120" min="20" max="500" step="5" inputmode="numeric"></div></div>
<div class="detail-row" style="border-top:1px solid #334155;margin-top:4px"><span class="detail-label">Aporte</span><span class="detail-value" id="heatOut">—</span></div></div>
<div class="warning" id="warning"></div>
</div>
</div>

<div class="panel" id="tab-reference">
<label>Proceso</label>
<div class="process-tabs" id="refProcessTabs">
<button class="process-tab active" data-refprocess="mig">MIG/MAG</button>
<button class="process-tab" data-refprocess="tig">TIG</button>
<button class="process-tab" data-refprocess="stick">Electrodo</button>
<button class="process-tab" data-refprocess="fcaw">FCAW</button>
</div>
<div id="refContent"></div>
</div>

<div class="panel" id="tab-machine">
<label for="machineSearch">🔍 Buscar Máquina</label>
<div class="machine-search-wrapper">
<input type="text" id="machineSearch" placeholder="Ej: Parkside, Einhell, 200A, Vevor..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
<button class="machine-search-clear" id="machineSearchClear" aria-label="Limpiar">✕</button>
</div>
<div class="search-hint" id="searchHint">Escribe parte del nombre para filtrar</div>
<label for="machine">Seleccionar Soldadora</label>
<select id="machine"></select>
<div id="machineDetails"></div>
<label for="dutyAmps">Amperaje Objetivo (A)</label>
<input type="number" id="dutyAmps" value="100" min="20" max="400" step="5" inputmode="numeric">
<div style="font-size:0.75rem;color:var(--text-dim);margin-bottom:6px">Ciclo de trabajo: <span id="dutyPercent" style="color:var(--accent);font-weight:700">—</span></div>
<div class="duty-bar"><div class="duty-bar-fill" id="dutyBar" style="width:0%"></div></div>
<div class="warning" id="machineWarning" style="margin-top:16px"></div>

<div style="margin-top:24px;border-top:1px solid var(--border);padding-top:16px">
<label>Mis Máquinas</label>
<div id="customMachinesList" class="custom-machines-list"></div>
<button class="btn-secondary" id="btnAddMachine" style="width:100%;margin-top:8px">➕ Añadir máquina</button>
<div class="add-machine-form" id="addMachineForm">
<label>Nombre</label><input type="text" id="newMchName" placeholder="Ej: Mi soldadora Parkside" maxlength="40">
<div class="row"><div><label>Amperaje máx (A)</label><input type="number" id="newMchAmps" value="160" min="20" max="500" step="10" inputmode="numeric"></div>
<div><label>Voltaje</label><select id="newMchVolts"><option>230 V</option><option>120 V</option><option>120/230 V</option></select></div></div>
<label>Procesos</label>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
<label style="display:flex;align-items:center;gap:4px;font-size:0.8rem;text-transform:none"><input type="checkbox" id="newMchMIG" checked> MIG</label>
<label style="display:flex;align-items:center;gap:4px;font-size:0.8rem;text-transform:none"><input type="checkbox" id="newMchTIG"> TIG</label>
<label style="display:flex;align-items:center;gap:4px;font-size:0.8rem;text-transform:none"><input type="checkbox" id="newMchStick" checked> Electrodo</label>
<label style="display:flex;align-items:center;gap:4px;font-size:0.8rem;text-transform:none"><input type="checkbox" id="newMchFCAW" checked> FCAW</label>
</div>
<label style="display:flex;align-items:center;gap:6px;font-size:0.8rem;text-transform:none;margin-bottom:14px"><input type="checkbox" id="newMchGasless"> FCAW sin gas (hilo con fundente interno)</label>
<div class="row"><div><label>Ciclo ref. (%)</label><input type="number" id="newMchDuty" value="25" min="5" max="100" step="5" inputmode="numeric"></div>
<div><label>Amp. ref. ciclo</label><input type="number" id="newMchDutyAmps" value="100" min="20" max="400" step="10" inputmode="numeric"></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
<button class="btn-primary" id="btnSaveMachine" style="margin-top:0">Guardar</button>

$('stickElectrode').innerHTML=Object.keys(STICK_ELECTRODES).map(k=>`<option value="${k}" ${k==='7018'?'selected':''}>E${k}</option>`).join('');
$('stickDiameter').innerHTML=Object.keys(STICK_BASE_AMPS).map(k=>`<option value="${k}" ${k==='3.2'?'selected':''}>${k} mm</option>`).join('');
}

function normalize(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();}

/* ============================================================
   POPULATE MACHINES WITH SEARCH
   ============================================================ */
function populateMachines(query){
query=query||'';
const nq=normalize(query);
const grouped={};let count=0;
Object.entries(MACHINE_DB).forEach(([k,v])=>{
if(nq){const hay=normalize(v.name+' '+v.category+' '+(v.processes||[]).join(' '));if(!hay.includes(nq))return;}
if(!grouped[v.category])grouped[v.category]=[];
grouped[v.category].push(`<option value="${k}">${v.name}</option>`);
count++;
});
customMachines.forEach(m=>{
if(nq){const hay=normalize(m.name+' '+(m.processes||[]).join(' '));if(!hay.includes(nq))return;}
if(!grouped['Mis máquinas'])grouped['Mis máquinas']=[];
grouped['Mis máquinas'].push(`<option value="${m.id}">${m.name}</option>`);
count++;
});
let html='';
if(count===0){html='<option value="">— Sin resultados —</option>';}
else{
html='<option value="">— Selecciona una máquina —</option>';
Object.entries(grouped).forEach(([cat,opts])=>{html+=`<optgroup label="${cat}">${opts.join('')}</optgroup>`;});
}
$('machine').innerHTML=html;
if(selectedMachine){
const key=selectedMachine._key||selectedMachine.id;
if([...$('machine').options].some(o=>o.value===key))$('machine').value=key;
}
const hint=$('searchHint');
if(nq){
hint.textContent=count===0?`Sin resultados para "${query}"`:`${count} máquina${count>1?'s':''} encontrada${count>1?'s':''}`;
hint.style.color=count===0?'var(--danger)':'var(--ok)';
$('machineSearchClear').classList.add('show');
}else{
hint.textContent='Escribe parte del nombre para filtrar';
hint.style.color='var(--text-dim)';
$('machineSearchClear').classList.remove('show');
}
}

function resetMachineConstraints(){

// Restore all wire options
[...$('migWire').options].forEach(o=>o.style.display='');

[...$('stickDiameter').options].forEach(o=>o.style.display='');

$('fcawGaslessNote').style.display='none';

function updateGasVisibility(){
// Called when process tab changes — shows/hides gas based on selected machine
if(!selectedMachine){
$('migGasGroup').style.display='';
$('fcawGasGroup').style.display='';
$('fcawGaslessNote').style.display='none';
return;
}
// MIG gas: only if machine does MIG with gas
if(currentProcess==='mig'){
$('migGasGroup').style.display='';
}
// FCAW gas: hidden if gaslessFCAW
if(currentProcess==='fcaw'){
if(selectedMachine.gaslessFCAW){
$('fcawGasGroup').style.display='none';
$('fcawGaslessNote').style.display='block';
}else{
$('fcawGasGroup').style.display='';
$('fcawGaslessNote').style.display='none';
}
}
}

function applyMachineConstraints(m){
const procs=m.processes||[];

// 1) Hide unsupported process tabs
document.querySelectorAll('#processTabs .process-tab').forEach(tab=>{
tab.style.display=procs.includes(tab.dataset.process)?'':'none';
});

// 2) Filter wire options for MIG
if(procs.includes('mig')){
if(m.supportedWires){
[...$('migWire').options].forEach(o=>{o.style.display=m.supportedWires.includes(o.value)?'':'none';});
if(!m.supportedWires.includes($('migWire').value))$('migWire').value=m.supportedWires[0];
}
$('migGasGroup').style.display='';
}

// 3) Filter wire options for FCAW + gas visibility
if(procs.includes('fcaw')){
if(m.supportedWires){
[...$('fcawWire').options].forEach(o=>{o.style.display=m.supportedWires.includes(o.value)?'':'none';});
if(!m.supportedWires.includes($('fcawWire').value))$('fcawWire').value=m.supportedWires[0];
}
if(m.gaslessFCAW){
$('fcawGasGroup').style.display='none';
$('fcawGaslessNote').style.display='block';
}else{
$('fcawGasGroup').style.display='';
$('fcawGaslessNote').style.display='none';
}
}

// 4) Filter stick electrode diameters
if(procs.includes('stick')&&m.supportedStickDia){
[...$('stickDiameter').options].forEach(o=>{o.style.display=m.supportedStickDia.includes(o.value)?'':'none';});
if(!m.supportedStickDia.includes($('stickDiameter').value))$('stickDiameter').value=m.supportedStickDia[0];
}

// 5) Constraint note
const notes=[];
if(m.gaslessFCAW)notes.push('🟣 FCAW sin gas — hilo tubular con fundente interno');
if(m.supportedWires)notes.push(`🔵 Hilos soportados: ${m.supportedWires.join(', ')} mm`);
if(m.supportedStickDia)notes.push(`🟠 Electrodos soportados: ${m.supportedStickDia.join(', ')} mm`);
const noteEl=$('constraintNote');
if(notes.length){
noteEl.classList.add('show');
noteEl.innerHTML=`<strong>Restricciones de ${m.name}</strong>`+notes.map(n=>`<div>${n}</div>`).join('');
}else{
noteEl.classList.remove('show');
}
}

const proc=m.defaultProcess||(m.processes&&m.processes[0])||'stick';
currentProcess=proc;
document.querySelectorAll('#processTabs .process-tab').forEach(b=>{b.classList.toggle('active',b.dataset.process===proc);});
document.querySelectorAll('.process-inputs').forEach(el=>el.style.display='none');

const sel=proc==='mig'?$('migWire'):$('fcawWire');

if(proc==='stick'){
const d=m.defaultStickDia||(m.supportedStickDia?m.supportedStickDia[0]:'3.2');

const th=m.defaultThickness||4;

else if(proc==='fcaw')$('fcawThickness').value=th;

// Auto-set reference table

document.querySelectorAll('#refProcessTabs .process-tab').forEach(b=>b.classList.toggle('active',b.dataset.refprocess===proc));
buildReference(proc);

// Highlight guide
highlightGuideProcess(proc);

// Duty
$('dutyAmps').value=m.dutyRef?m.dutyRef.amps:100;
updateDutyCycle();

// Banner
const banner=$('machineBanner');
banner.classList.add('show');
const dia=m.defaultWire?m.defaultWire+' mm':(m.defaultStickDia?m.defaultStickDia+' mm':'—');
banner.innerHTML=`✅ <strong>${m.name}</strong><br><span style="font-size:0.75rem;opacity:0.9">Proceso: ${proc.toUpperCase()} · Ø: ${dia} · Espesor: ${th} mm · Máx: ${m.maxAmps} A</span>`;

setTimeout(()=>calculate(),100);
}

/* ============================================================
   CALCULATE
   ============================================================ */
function setupCalcButton(){$('btnCalc').addEventListener('click',()=>{calculate();setTimeout(()=>$('result').scrollIntoView({behavior:'smooth',block:'start'}),100);});}
function calculate(){
if(currentProcess==='mig')calcMIG();
else if(currentProcess==='tig')calcTIG();
else if(currentProcess==='stick')calcStick();
else if(currentProcess==='fcaw')calcFCAW();
$('result').classList.add('show');
}
function getThicknessMM(id){const v=parseFloat($(id).value)||0;return units==='metric'?v:v*MM_PER_INCH;}

function calcMIG(){
const wire=$('migWire').value;const thickness=getThicknessMM('migThickness');
const joint=$('migJoint').value,position=$('migPosition').value,gas=$('migGas').value;
if(!thickness||thickness<=0)return showToast('Introduce un espesor válido.');
const d=MIG_DATA[wire];const tRatio=Math.min(1,thickness/d.thicknessMax);
let ampsMin=d.baseAmps[0]+(d.baseAmps[1]-d.baseAmps[0])*Math.max(0,tRatio-0.15);
let ampsMax=d.baseAmps[0]+(d.baseAmps[1]-d.baseAmps[0])*Math.min(1,tRatio+0.15);
let voltsMin=d.baseVolts[0]+(d.baseVolts[1]-d.baseVolts[0])*Math.max(0,tRatio-0.15);
let voltsMax=d.baseVolts[0]+(d.baseVolts[1]-d.baseVolts[0])*Math.min(1,tRatio+0.15);
const posF=POSITION_FACTOR[position],jointF=JOINT_FACTOR[joint];
ampsMin*=posF*jointF;ampsMax*=posF*jointF;
const vPosF=VOLTAGE_POS_FACTOR[position];voltsMin*=vPosF;voltsMax*=vPosF;
let gasFlow=d.gasFlow.slice();
if(gas==='co2'){voltsMax*=1.05;gasFlow[0]+=2;gasFlow[1]+=3;}else if(gas==='ar'){voltsMax*=1.03;}
ampsMin=Math.round(ampsMin);ampsMax=Math.round(ampsMax);voltsMin=Math.round(voltsMin);voltsMax=Math.round(voltsMax);
const wfsMin=(d.wfs[0]*posF*jointF).toFixed(1);const wfsMax=(d.wfs[1]*posF*jointF).toFixed(1);
const passes=Math.max(1,Math.ceil(thickness/(d.thicknessMax*0.6)));
lastResult={process:'MIG',ampsMin,ampsMax,voltage:`${voltsMin}–${voltsMax} V`,polarity:'DC+ (DCEP)',gasFlow:`${gasFlow[0]}–${gasFlow[1]} l/min`,wireSpeed:`${wfsMin}–${wfsMax} m/min`,passes,thickness,position,material:null};
renderResult(lastResult);$('wireSpeedLabel').style.display='flex';$('resultProcessLabel').textContent='MIG/MAG — Amperaje Recomendado';}

function calcTIG(){
const material=$('tigMaterial').value;const thickness=getThicknessMM('tigThickness');
const joint=$('tigJoint').value,position=$('tigPosition').value;
if(!thickness||thickness<=0)return showToast('Introduce un espesor válido.');
const d=TIG_DATA[material];const posF=POSITION_FACTOR[position],jointF=JOINT_FACTOR[joint];
let ampsMin=thickness*d.ampsPerMM[0]*posF*jointF;let ampsMax=thickness*d.ampsPerMM[1]*posF*jointF;
ampsMin=Math.max(10,Math.round(ampsMin));ampsMax=Math.max(15,Math.round(ampsMax));
const voltsMin=material==='aluminum'?12:10;const voltsMax=material==='aluminum'?16:14;
const passes=Math.max(1,Math.ceil(thickness/4));
lastResult={process:'TIG',ampsMin,ampsMax,voltage:`${voltsMin}–${voltsMax} V`,polarity:d.currentType,gasFlow:`${d.gasFlow[0]}–${d.gasFlow[1]} l/min (Argón)`,wireSpeed:'—',passes,thickness,position,material};
renderResult(lastResult);$('wireSpeedLabel').style.display='none';$('resultProcessLabel').textContent='TIG — Amperaje Recomendado';}

function calcStick(){
const electrode=$('stickElectrode').value;const diameter=$('stickDiameter').value;
const thickness=getThicknessMM('stickThickness');const joint=$('stickJoint').value,position=$('stickPosition').value,material=$('stickMaterial').value;
if(!thickness||thickness<=0)return showToast('Introduce un espesor válido.');
const e=STICK_ELECTRODES[electrode];const[baseMin,baseMax]=STICK_BASE_AMPS[diameter]||STICK_BASE_AMPS['3.2'];
const posF=POSITION_FACTOR[position],matF=MATERIAL_FACTOR_STICK[material],jointF=JOINT_FACTOR[joint];
const thickF=thickness<=3?0.85:thickness<=6?0.95:thickness<=10?1.00:thickness<=20?1.05:1.10;
let ampsMin=baseMin*e.factor*posF*thickF*matF*jointF;let ampsMax=baseMax*e.factor*posF*thickF*matF*jointF;
if(thickness<2)ampsMax*=0.9;
ampsMin=Math.round(ampsMin);ampsMax=Math.round(ampsMax);
const passes=Math.max(1,Math.ceil((thickness/3.5)*({butt:1,lap:1.2,tee:1.3,corner:1.1}[joint]||1)));
lastResult={process:'Electrodo',ampsMin,ampsMax,voltage:`${e.volts} V`,polarity:e.polarity,gasFlow:'— (electrodo revestido)',wireSpeed:'—',passes,thickness,position,material};
renderResult(lastResult);$('wireSpeedLabel').style.display='none';$('resultProcessLabel').textContent='Electrodo — Amperaje Recomendado';}

function calcFCAW(){
const wire=$('fcawWire').value;const thickness=getThicknessMM('fcawThickness');
const joint=$('fcawJoint').value,position=$('fcawPosition').value;
const isGasless=selectedMachine&&selectedMachine.gaslessFCAW;
const gas=isGasless?null:$('fcawGas').value;
if(!thickness||thickness<=0)return showToast('Introduce un espesor válido.');
const d=FCAW_DATA[wire];const tRatio=Math.min(1,thickness/15);
let ampsMin=d.baseAmps[0]+(d.baseAmps[1]-d.baseAmps[0])*Math.max(0,tRatio-0.15);
let ampsMax=d.baseAmps[0]+(d.baseAmps[1]-d.baseAmps[0])*Math.min(1,tRatio+0.15);
let voltsMin=d.baseVolts[0]+(d.baseVolts[1]-d.baseVolts[0])*Math.max(0,tRatio-0.15);
let voltsMax=d.baseVolts[0]+(d.baseVolts[1]-d.baseVolts[0])*Math.min(1,tRatio+0.15);
const posF=POSITION_FACTOR[position],jointF=JOINT_FACTOR[joint];
ampsMin*=posF*jointF;ampsMax*=posF*jointF;
const vPosF=VOLTAGE_POS_FACTOR[position];voltsMin*=vPosF;voltsMax*=vPosF;
let gasFlow=d.gasFlow.slice();let gasText;
if(isGasless){
gasText='Sin gas (fundente interno)';
}else{
if(gas==='mix'){gasFlow[0]+=1;gasFlow[1]+=2;}
gasText=`${gasFlow[0]}–${gasFlow[1]} l/min`;
}
ampsMin=Math.round(ampsMin);ampsMax=Math.round(ampsMax);voltsMin=Math.round(voltsMin);voltsMax=Math.round(voltsMax);
const wfsMin=(d.wfs[0]*posF*jointF).toFixed(1);const wfsMax=(d.wfs[1]*posF*jointF).toFixed(1);
const passes=Math.max(1,Math.ceil(thickness/5));
// Gasless FCAW uses DCEN (electrode negative) typically
const polarity=isGasless?'DC- (DCEN)':'DC+ (DCEP)';
lastResult={process:'FCAW',ampsMin,ampsMax,voltage:`${voltsMin}–${voltsMax} V`,polarity,gasFlow:gasText,wireSpeed:`${wfsMin}–${wfsMax} m/min`,passes,thickness,position,material:null};
renderResult(lastResult);$('wireSpeedLabel').style.display='flex';$('resultProcessLabel').textContent=isGasless?'FCAW (sin gas) — Amperaje Recomendado':'FCAW — Amperaje Recomendado';}

function renderResult(r){
if(selectedMachine&&r.ampsMax>selectedMachine.maxAmps){
r.ampsMax=selectedMachine.maxAmps;
if(r.ampsMin>selectedMachine.maxAmps)r.ampsMin=selectedMachine.maxAmps;
}
$('currentRange').textContent=`${r.ampsMin} – ${r.ampsMax} A`;
$('voltageOut').textContent=r.voltage;
const polCls=(r.polarity||'').includes('DC+')?'dc\\+':(r.polarity||'').includes('DC-')?'dc-':'ac';
$('polarityOut').innerHTML=`<span class="polarity-badge ${polCls}">${r.polarity}</span>`;
$('gasFlowOut').textContent=r.gasFlow;$('wireSpeedOut').textContent=r.wireSpeed;
$('passesOut').textContent=r.passes+' '+(r.passes>1?'pasadas':'pasada');
$('heatAmps').value=Math.round((r.ampsMin+r.ampsMax)/2);updateHeatInput();
let warn='⚠️ Verifica con probeta. Ajusta ±10–15% según el arco.';
if(selectedMachine&&r.ampsMax>=selectedMachine.maxAmps)warn=`⚠️ Tu máquina alcanza máx ${selectedMachine.maxAmps}A. La app ha limitado el resultado.`;
else if(r.thickness<2)warn='⚠️ Material delgado: reduce amperaje y aumenta velocidad.';
else if(r.thickness>15)warn='⚠️ Material grueso: considera precalentamiento.';
else if(r.material==='stainless')warn='⚠️ Inox: mantén interpass bajo 150°C.';
else if(r.material==='aluminum')warn='⚠️ Aluminio: usa AC y limpia la superficie.';
else if(r.material==='cast')warn='⚠️ Fundición: precalienta 200–400°C.';
else if(r.position==='vertical')warn='⚠️ Vertical: reduce amperaje un 10–15%.';
else if(r.position==='overhead')warn='⚠️ Sobre cabeza: reduce amperaje un 15–20%.';
$('warning').textContent=warn;
}

function updateHeatInput(){
const amps=parseFloat($('heatAmps').value)||0;let volts=24;
if(lastResult&&lastResult.voltage){const m=lastResult.voltage.match(/(\d+)/);if(m)volts=parseInt(m[1]);}
const speed=parseFloat($('travelSpeed').value)||200;
const heat=(amps*volts*60)/(speed*1000);const heatIP=heat*25.4;
const el=$('heatOut');el.textContent=units==='metric'?`${heat.toFixed(2)} kJ/mm`:`${heatIP.toFixed(2)} kJ/in`;
el.style.color=heat>2.5?'#fca5a5':heat<0.5?'#86efac':'#f1f5f9';
}

function buildReference(process){
const c=$('refContent');let html='';
if(process==='mig'){html+=`<div class="ref-section-title">🔵 MIG/MAG — Parámetros por Ø de Hilo</div><div class="table-wrap"><table class="ref-table"><thead><tr><th>Hilo</th><th>Amperaje</th><th>Voltaje</th><th>Espesor Máx.</th></tr></thead><tbody>`;
Object.entries(MIG_DATA).forEach(([k,d])=>{html+=`<tr><td>${k} mm</td><td>${d.baseAmps[0]}–${d.baseAmps[1]} A</td><td>${d.baseVolts[0]}–${d.baseVolts[1]} V</td><td>${d.thicknessMax} mm</td></tr>`;});
html+=`</tbody></table></div>`;}
else if(process==='tig'){html+=`<div class="ref-section-title">🟢 TIG — Parámetros por Material</div><div class="table-wrap"><table class="ref-table"><thead><tr><th>Material</th><th>Corriente</th><th>A/mm</th></tr></thead><tbody>`;
Object.entries(TIG_DATA).forEach(([k,d])=>{const n={carbon:'Acero Carbono',stainless:'Inoxidable',aluminum:'Aluminio'};html+=`<tr><td>${n[k]||k}</td><td>${d.currentType}</td><td>${d.ampsPerMM[0]}–${d.ampsPerMM[1]} A/mm</td></tr>`;});
html+=`</tbody></table></div>`;}
else if(process==='stick'){html+=`<div class="ref-section-title">🟠 Electrodo — Amperaje por Ø</div><div class="table-wrap"><table class="ref-table"><thead><tr><th>Ø</th><th>Rango (A)</th></tr></thead><tbody>`;
Object.entries(STICK_BASE_AMPS).forEach(([k,v])=>{html+=`<tr><td>${k} mm</td><td>${v[0]}–${v[1]} A</td></tr>`;});
html+=`</tbody></table></div><div class="ref-section-title">🟠 Electrodo — Polaridad</div><div class="table-wrap"><table class="ref-table"><thead><tr><th>Electrodo</th><th>Polaridad</th></tr></thead><tbody>`;
Object.entries(STICK_ELECTRODES).forEach(([k,d])=>{html+=`<tr><td>E${k}</td><td>${d.polarity}</td></tr>`;});
html+=`</tbody></table></div>`;}
else if(process==='fcaw'){html+=`<div class="ref-section-title">🟣 FCAW — Parámetros por Ø de Hilo</div><div class="table-wrap"><table class="ref-table"><thead><tr><th>Hilo</th><th>Amperaje</th><th>Voltaje</th></tr></thead><tbody>`;
Object.entries(FCAW_DATA).forEach(([k,d])=>{html+=`<tr><td>${k} mm</td><td>${d.baseAmps[0]}–${d.baseAmps[1]} A</td><td>${d.baseVolts[0]}–${d.baseVolts[1]} V</td></tr>`;});
html+=`</tbody></table></div>
<div class="ref-section-title">🟣 FCAW — Con gas vs sin gas</div>
<div class="table-wrap"><table class="ref-table"><thead><tr><th>Tipo</th><th>Polaridad</th><th>Uso</th></tr></thead><tbody>
<tr><td>Con gas (M21/CO₂)</td><td>DC+</td><td>Alta calidad, taller</td></tr>
<tr><td>Sin gas (fundente interno)</td><td>DC-</td><td>Exterior, portátil</td></tr>
</tbody></table></div>`;}
c.innerHTML=html;
}

function setupGuide(){buildGuide();}
function buildGuide(){
$('guideContent').innerHTML=`
<div class="guide-card" data-process="mig"><h3>🔵 MIG/MAG <span class="active-badge">Tu máquina</span></h3>
<p><strong>Hilo continuo con gas.</strong> Ideal para chapa fina a media. Polaridad DC+. Gas: Ar+CO₂ (M21) para acero, Argón puro para aluminio.</p>
<p>Ajusta el <strong>voltaje</strong> para la longitud de arco y la <strong>velocidad de hilo</strong> para la corriente.</p></div>

<div class="guide-card" data-process="tig"><h3>🟢 TIG <span class="active-badge">Tu máquina</span></h3>
<p><strong>Electrodo de tungsteno no consumible.</strong> Máxima calidad y control. DCEN para acero e inox, AC para aluminio.</p>
<p>Rango típico: <strong>30–40 A/mm</strong> en acero, 25–35 A/mm en inox, 35–50 A/mm en aluminio. Gas: argón puro.</p></div>

<div class="guide-card" data-process="stick"><h3>🟠 Electrodo (SMAW) <span class="active-badge">Tu máquina</span></h3>
<p><strong>Electrodo revestido consumible.</strong> Versátil, funciona con viento. E6013 uso general, E7018 estructural (bajo hidrógeno).</p>
<p>Polaridad según tipo: <strong>DC+</strong> para 6010/7018, <strong>AC/DC-</strong> para 6013/7024.</p></div>

<div class="guide-card" data-process="fcaw"><h3>🟣 FCAW <span class="active-badge">Tu máquina</span></h3>
<p><strong>Hilo tubular con fundente interno.</strong> Alta deposición. Puede usarse con o sin gas.</p>
<p><strong>Con gas (DC+):</strong> mayor calidad, taller.<br><strong>Sin gas (DC-, self-shielded):</strong> exterior, portátil, ideal para máquinas domésticas como Parkside PIFDS 120AL.</p></div>

<div class="guide-card"><h3>📐 Reglas generales</h3>
<p><strong>Amperaje aproximado:</strong> 30–40 A por mm de espesor para electrodo revestido, 25–35 A/mm para TIG en acero, 35–50 A/mm para TIG en aluminio.</p>
<p><strong>Aporte térmico:</strong> Heat Input (kJ/mm) = (A × V × 60) / (Vel × 1000). Valores típicos: 0,5–2,5 kJ/mm. Inoxidables: &lt;1,5 kJ/mm.</p></div>

<div class="guide-card"><h3>⚠️ Seguridad</h3>
<p>Usa siempre <strong>careta homologada</strong>, guantes de cuero, delantal y ventilación adecuada. Nunca sueldes en espacios confinados sin extracción.</p></div>`;

if(selectedMachine){
const proc=selectedMachine.defaultProcess||(selectedMachine.processes&&selectedMachine.processes[0]);
if(proc)highlightGuideProcess(proc);
}
}

let toastTimer=null;
function showToast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2500);}
</script>
</body>
